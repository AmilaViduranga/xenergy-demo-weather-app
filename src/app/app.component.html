<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">Nimbus</p>
        <p class="brand-tag">Weather lab for CI/CD demos</p>
      </div>
    </div>

    <div class="topbar-actions">
      <p class="credit">Current and forecast data by OpenWeather</p>
      <button
        type="button"
        class="theme-toggle"
        data-testid="theme-toggle"
        [attr.aria-label]="mode() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'"
        (click)="toggleTheme()"
      >
        {{ mode() === 'light' ? 'Dark' : 'Light' }}
      </button>
      @if (user$ | async; as user) {
        <div class="session" data-testid="user-session">
          <span class="session-email" data-testid="user-email">{{ user.email }}</span>
          <button type="button" class="logout-btn" data-testid="logout-button" (click)="logout()">
            Log out
          </button>
        </div>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
